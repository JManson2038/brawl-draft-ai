<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Draft AI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#11131a;color:#e8eaf0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0 1.25rem;border-bottom:1px solid #2a2d3a;margin-bottom:1.25rem}
.logo{font-size:17px;font-weight:600;color:#fff}.logo span{color:#f5a623}
.hdr-btns{display:flex;align-items:center;gap:8px}
.hdr-btn{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #2a2d3a;background:transparent;color:#888;cursor:pointer;transition:all .15s}
.hdr-btn:hover{border-color:#555;color:#e8eaf0}
.cfg-row{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:flex-end}
.cfg-group label{display:block;font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.cfg-input{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #2a2d3a;background:#1c1f2b;color:#e8eaf0;min-width:180px;cursor:pointer}
.cfg-group select{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid #2a2d3a;background:#1c1f2b;color:#e8eaf0;min-width:150px;cursor:pointer}
.bans-panel{background:#1c1f2b;border:1px solid #2a2d3a;border-radius:12px;padding:12px;margin-bottom:1.25rem}
.bans-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pt-ban{color:#e74c3c}.pt-your{color:#2ecc71}.pt-enemy{color:#3498db}.pt-rec{color:#f5a623}
.ban-row{display:flex;gap:6px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:1fr auto 1fr 220px;gap:8px;margin-bottom:1.25rem;align-items:start}
.panel{background:#1c1f2b;border:1px solid #2a2d3a;border-radius:12px;padding:12px}
.slot-section-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#666;margin-bottom:6px}
.slot-row{display:flex;gap:6px}
.slot-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.slot{width:52px;height:52px;border-radius:10px;border:1.5px dashed #2a2d3a;background:#13161f;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;overflow:hidden}
.slot:hover{border-color:#444}
.slot.active{border-color:#2ecc71;background:#0d2318;box-shadow:0 0 0 2px #2ecc7130}
.slot.enemy-active{border-color:#3498db;background:#0d1a23;box-shadow:0 0 0 2px #3498db30}
.slot.ban-active{border-color:#e74c3c;background:#230d0d;box-shadow:0 0 0 2px #e74c3c30}
.slot.filled{border-style:solid;border-color:#2a2d3a;background:#1c1f2b}
.slot.ban-slot.filled{border-color:#5a1a1a;background:#1a1010}
.slot img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.slot .sname{font-size:7px;font-weight:600;color:#ccc;text-align:center;line-height:1.2;padding:0 2px;margin-top:1px}
.slot .empty-icon{font-size:20px;color:#2a2d3a}
.slot.ban-slot .empty-icon{color:#3a2020}
.slot-lbl{font-size:8px;color:#555;font-weight:500}
.drag-over{border-color:#f5a623!important;background:#231d0a!important}
.swap-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-top:28px}
.swap-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid #2a2d3a;background:transparent;color:#888;cursor:pointer;transition:all .15s;white-space:nowrap}
.swap-btn:hover{border-color:#f5a623;color:#f5a623}
.mode-bar{background:#13161f;border:1px solid #2a2d3a;border-radius:10px;padding:8px 10px;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode-label{font-size:11px;color:#666}
.mode-text{font-size:12px;font-weight:600;color:#f5a623}
.rec-list{display:flex;flex-direction:column;gap:6px}
.rec-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:#13161f;border:1px solid #2a2d3a}
.rec-item.rank-1{border-color:#f5a623}
.rec-rank{font-size:11px;font-weight:700;width:16px;text-align:center}
.rec-rank.r1{color:#f5a623}.rec-rank.r2{color:#aaa}.rec-rank.r3{color:#cd7f32}.rec-rank.r4,.rec-rank.r5{color:#555}
.rec-img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1.5px solid #2a2d3a}
.rec-info{flex:1;min-width:0}
.rec-name{font-size:12px;font-weight:600;color:#e8eaf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-bar-wrap{height:3px;background:#2a2d3a;border-radius:2px;margin-top:3px}
.rec-bar-fill{height:100%;border-radius:2px;background:#2ecc71;transition:width .4s}
.rec-pct{font-size:11px;color:#888;white-space:nowrap}
.rec-empty{font-size:12px;color:#555;text-align:center;padding:1rem 0}
.err-msg{font-size:11px;color:#e74c3c;padding:4px 0}
.rec-btn{width:100%;padding:8px;border-radius:8px;border:1px solid #f5a623;background:transparent;color:#f5a623;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:10px}
.rec-btn:hover{background:#231d0a}
.rec-btn:disabled{opacity:.4;pointer-events:none}
.grid-panel{background:#1c1f2b;border:1px solid #2a2d3a;border-radius:12px;padding:12px}
.grid-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.grid-top-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#888}
.search{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid #2a2d3a;background:#13161f;color:#e8eaf0;width:130px}
.brawler-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
.bc{padding:5px 3px;border-radius:8px;border:1px solid #2a2d3a;cursor:grab;text-align:center;background:#13161f;transition:all .1s;user-select:none}
.bc:hover{background:#1c1f2b;border-color:#444}
.bc.used{opacity:.2;pointer-events:none}
.bc.dragging{opacity:.3}
.bc img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 2px;background:#2a2d3a;pointer-events:none}
.bc .bn{font-size:8px;font-weight:600;color:#ccc;line-height:1.2;pointer-events:none}
.bc .bcls{font-size:7px;color:#555;pointer-events:none}
@media(max-width:800px){.layout{grid-template-columns:1fr 1fr}.swap-col{display:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">Brawl <span>Draft AI</span></div>
  <div class="hdr-btns">
    <div style="font-size:11px;color:#555">XGBoost · Masters+ data</div>
    <button class="hdr-btn" onclick="resetDraft()">Reset draft</button>
  </div>
</header>

<div class="cfg-row">
  <div class="cfg-group"><label>Map</label>
    <input class="cfg-input" id="map-search" list="map-list" placeholder="Search map..." oninput="autoRec()" value="Sneaky Fields">
    <datalist id="map-list">
      <option>Abracadabra</option><option>Ancestral Roots</option><option>Arabesque</option>
      <option>Backyard Bowl</option><option>Beach Ball</option><option>Belle's Rock</option>
      <option>Below Zero</option><option>Bouncy Bowl</option><option>Cabin Fever</option>
      <option>Chivalry</option><option>Crab Claws</option><option>Crystal Arcade</option>
      <option>Deep Diner</option><option>Double Swoosh</option><option>Dueling Beetles</option>
      <option>Field Goal</option><option>Flaring Phoenix</option><option>From Dusk till Dawn</option>
      <option>Galaxy Arena</option><option>Gem Fort</option><option>Goldarm Gulch</option>
      <option>Grass Knot</option><option>Hard Rock Mine</option><option>Healthy Middle Ground</option>
      <option>Hyacinth House</option><option>Hyperspace</option><option>Konnakol</option>
      <option>Match 1123581321</option><option>New Perspective</option><option>Nutmeg</option>
      <option>Open Business</option><option>Opening Move</option><option>Out in the Open</option>
      <option>Parallel Plays</option><option>Picturesque</option><option>Pinball Dreams</option>
      <option>Pinhole Punt</option><option>Pinned Down</option><option>Puddle Splash</option>
      <option>Sidetrack</option><option>Slippery Showdown</option><option>Sneaky Fields</option>
      <option>Spiraling Out</option><option>Stardust Storm</option><option>Street Brawler 2</option>
      <option>Sunny Soccer</option><option>Super Beach</option><option>Super Center</option>
      <option>Tip Toe</option><option>Triple Dribble</option><option>Whisper Vale</option>
    </datalist>
  </div>
  <div class="cfg-group"><label>Mode</label>
    <select class="cfg-input" id="mode-sel" onchange="autoRec()">
      <option value="brawlBall">Brawl Ball</option>
      <option value="gemGrab">Gem Grab</option>
      <option value="knockout">Knockout</option>
      <option value="hotZone">Hot Zone</option>
    </select>
  </div>
</div>

<div class="bans-panel">
  <div class="bans-header">
    <div class="panel-title pt-ban">Bans</div>
    <div style="font-size:11px;color:#666">up to 6 total</div>
  </div>
  <div class="ban-row">
    <div class="slot-wrap"><div class="slot ban-slot ban-active" data-t="ban" data-k="ban" data-i="0" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B1</div></div>
    <div class="slot-wrap"><div class="slot ban-slot" data-t="ban" data-k="ban" data-i="1" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B2</div></div>
    <div class="slot-wrap"><div class="slot ban-slot" data-t="ban" data-k="ban" data-i="2" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B3</div></div>
    <div class="slot-wrap"><div class="slot ban-slot" data-t="ban" data-k="ban" data-i="3" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B4</div></div>
    <div class="slot-wrap"><div class="slot ban-slot" data-t="ban" data-k="ban" data-i="4" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B5</div></div>
    <div class="slot-wrap"><div class="slot ban-slot" data-t="ban" data-k="ban" data-i="5" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-ban empty-icon"></i></div><div class="slot-lbl">B6</div></div>
  </div>
</div>

<div id="mode-bar" class="mode-bar">
  <span class="mode-label">Adding to:</span>
  <span class="mode-text" id="mode-text">bans — B1</span>
  <span style="font-size:11px;color:#444;margin-left:auto">click slot to switch · click filled slot to remove</span>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-title pt-your" style="margin-bottom:10px">Your picks</div>
    <div class="slot-row">
      <div class="slot-wrap"><div class="slot" data-t="your" data-k="pick" data-i="0" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P1</div></div>
      <div class="slot-wrap"><div class="slot" data-t="your" data-k="pick" data-i="1" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P2</div></div>
      <div class="slot-wrap"><div class="slot" data-t="your" data-k="pick" data-i="2" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P3</div></div>
    </div>
  </div>

  <div class="swap-col">
    <button class="swap-btn" onclick="swapPick(0)" title="Swap P1">⇄ P1</button>
    <button class="swap-btn" onclick="swapPick(1)" title="Swap P2">⇄ P2</button>
    <button class="swap-btn" onclick="swapPick(2)" title="Swap P3">⇄ P3</button>
  </div>

  <div class="panel">
    <div class="panel-title pt-enemy" style="margin-bottom:10px">Enemy picks</div>
    <div class="slot-row">
      <div class="slot-wrap"><div class="slot" data-t="enemy" data-k="pick" data-i="0" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P1</div></div>
      <div class="slot-wrap"><div class="slot" data-t="enemy" data-k="pick" data-i="1" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P2</div></div>
      <div class="slot-wrap"><div class="slot" data-t="enemy" data-k="pick" data-i="2" onclick="slotClick(this)" ondragover="dOver(event,this)" ondragleave="dLeave(this)" ondrop="dDrop(event,this)"><i class="ti ti-plus empty-icon"></i></div><div class="slot-lbl">P3</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title pt-rec" style="margin-bottom:10px">Top picks</div>
    <button class="rec-btn" id="rec-btn" onclick="getRecs()">Refresh</button>
    <div class="rec-list" id="rec-list">
      <div class="rec-empty">Loading...</div>
    </div>
  </div>
</div>

<div class="grid-panel">
  <div class="grid-top">
    <span class="grid-top-label">All brawlers — click or drag to slot</span>
    <input class="search" id="search" placeholder="Search..." oninput="renderGrid()">
  </div>
  <div class="brawler-grid" id="bgrid"></div>
</div>

</div>

<script>
const CDN='https://cdn.brawlify.com/brawlers/borderless/';
const BRAWLERS=[
  {id:16000000,name:"Shelly",cls:"damage"},{id:16000001,name:"Colt",cls:"damage"},
  {id:16000002,name:"Bull",cls:"tank"},{id:16000003,name:"Brock",cls:"marksman"},
  {id:16000004,name:"Rico",cls:"damage"},{id:16000005,name:"Spike",cls:"damage"},

  {id:16000026,name:"Bibi",cls:"tank"},{id:16000027,name:"8-Bit",cls:"damage"},

const state={bans:[],yp:[],ep:[]};
let activeEl=null;
let recTimer=null;

function sk(t,k){
  if(t==='ban')return'bans';
  if(t==='your')return'yp';
  return'ep';
}

function used(){return[...state.bans,...state.yp,...state.ep];}

function slotLabel(s){
  const t=s.dataset.t,i=parseInt(s.dataset.i)+1;
  if(t==='ban')return`bans — B${i}`;
  if(t==='your')return`your picks — P${i}`;
  return`enemy picks — P${i}`;
}

function setActive(s){
  document.querySelectorAll('.slot.active,.slot.enemy-active,.slot.ban-active').forEach(x=>{
    x.classList.remove('active','enemy-active','ban-active');
  });
  if(!s)return;
  if(s.dataset.t==='ban')s.classList.add('ban-active');
  else if(s.dataset.t==='your')s.classList.add('active');
  else s.classList.add('enemy-active');
  activeEl=s;
  document.getElementById('mode-text').textContent=slotLabel(s);
}

function slotClick(s){
  if(s.classList.contains('filled'))removeSlot(s);
  else setActive(s);
}

function removeSlot(s){
  const id=parseInt(s.dataset.bid);
  if(!id)return;
  const k=sk(s.dataset.t,s.dataset.k);
  state[k]=state[k].filter(x=>x!==id);
  s.classList.remove('filled');
  s.dataset.bid='';
  const icon=s.dataset.t==='ban'?'ti-ban':'ti-plus';
  s.innerHTML=`<i class="ti ${icon} empty-icon"></i>`;
  setActive(s);
  renderGrid();
  autoRec();
}

function fillSlotEl(slotEl, id){
  const b=BRAWLERS.find(x=>x.id===id);
  slotEl.innerHTML=b?`<img src="${CDN+id+'.png'}" alt="${b.name}"><div class="sname">${b.name}</div>`:'';
  slotEl.classList.add('filled');
  slotEl.dataset.bid=id;
  slotEl.classList.remove('active','enemy-active','ban-active','drag-over');
}

function clearSlotEl(slotEl){
  slotEl.classList.remove('filled');
  slotEl.dataset.bid='';
  const icon=slotEl.dataset.t==='ban'?'ti-ban':'ti-plus';
  slotEl.innerHTML=`<i class="ti ${icon} empty-icon"></i>`;
}

function place(slotEl,id){
  const nid=Number(id);
  const k=sk(slotEl.dataset.t,slotEl.dataset.k);
  const limit=k==='bans'?6:3;
  if(state[k].length>=limit)return false;
  const blocked=k==='bans'?[...state.yp,...state.ep]:[...state.yp,...state.ep,...state.bans];
  if(blocked.map(Number).includes(nid))return false;
  state[k].push(nid);
  fillSlotEl(slotEl,nid);
  renderGrid();
  advance();
  autoRec();
  return true;
}

function swapPick(idx){
  const yid=state.yp[idx];
  const eid=state.ep[idx];
  if(!yid&&!eid)return;
  state.yp[idx]=eid||undefined;
  state.ep[idx]=yid||undefined;
  state.yp=state.yp.filter(x=>x!==undefined);
  state.ep=state.ep.filter(x=>x!==undefined);
  syncSlotsFromState();
  renderGrid();
  autoRec();
}

function syncSlotsFromState(){
  ['your','enemy'].forEach(t=>{
    const arr=t==='your'?state.yp:state.ep;
    for(let i=0;i<3;i++){
      const s=document.querySelector(`.slot[data-t="${t}"][data-i="${i}"]`);
      if(!s)continue;
      if(arr[i]!==undefined){
        fillSlotEl(s,arr[i]);
      } else {
        clearSlotEl(s);
      }
    }
  });
}

function advance(){
  const empty=[...document.querySelectorAll('.slot:not(.filled)')];
  if(empty.length>0)setActive(empty[0]);
  else{activeEl=null;document.getElementById('mode-text').textContent='all slots filled';}
}

function addBrawler(id){
  if(!activeEl||activeEl.classList.contains('filled'))return;
  place(activeEl,id);
}

function resetDraft(){
  state.bans=[];state.yp=[];state.ep=[];
  document.querySelectorAll('.slot.filled').forEach(s=>clearSlotEl(s));
  renderGrid();
  setActive(document.querySelector('.slot'));
  getRecs();
}

function dOver(e,s){e.preventDefault();if(!s.classList.contains('filled'))s.classList.add('drag-over');}
function dLeave(s){s.classList.remove('drag-over');}
function dDrop(e,s){
  e.preventDefault();
  s.classList.remove('drag-over');
  const id=e.dataTransfer.getData('text/plain');
  if(!id||s.classList.contains('filled'))return;
  setActive(s);
  place(s,id);
}

function renderGrid(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const u=used().map(Number);
  document.getElementById('bgrid').innerHTML=BRAWLERS.filter(b=>!q||b.name.toLowerCase().includes(q)).map(b=>`
    <div class="bc${u.includes(b.id)?' used':''}"
      onclick="addBrawler(${b.id})"
      draggable="true"
      ondragstart="event.dataTransfer.setData('text/plain','${b.id}');this.classList.add('dragging')"
      ondragend="this.classList.remove('dragging')">
      <img src="${CDN+b.id+'.png'}" alt="${b.name}">
      <div class="bn">${b.name}</div>
      <div class="bcls">${b.cls}</div>
    </div>
  `).join('');
}

function autoRec(){
  clearTimeout(recTimer);
  recTimer=setTimeout(getRecs,300);
}

async function getRecs(){
  const btn=document.getElementById('rec-btn');
  const list=document.getElementById('rec-list');
  btn.disabled=true;
  try{
    const res=await fetch('http://127.0.0.1:8000/recommend',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        map:document.getElementById('map-search').value,
        mode:document.getElementById('mode-sel').value,
        your_picks:state.yp,
        enemy_picks:state.ep,
        your_bans:state.bans,
        enemy_bans:[]
      })
    });
    const data=await res.json();
    if(data.error){
      list.innerHTML=`<div class="err-msg">${data.error}</div>`;
    } else {
      const ranks=['r1','r2','r3','r4','r5'];
      list.innerHTML=data.recommendations.map((r,i)=>{
        const b=BRAWLERS.find(x=>x.name.toUpperCase()===r.brawler);
        const pct=Math.round(r.win_prob*100);
        return`<div class="rec-item${i===0?' rank-1':''}">
          <div class="rec-rank ${ranks[i]}">#${i+1}</div>
          ${b?`<img class="rec-img" src="${CDN+b.id+'.png'}" alt="${r.brawler}">`:''}
          <div class="rec-info">
            <div class="rec-name">${r.brawler}</div>
            <div class="rec-bar-wrap"><div class="rec-bar-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="rec-pct">${pct}%</div>
        </div>`;
      }).join('');
    }
  } catch(e){
    list.innerHTML='<div class="rec-empty" style="font-size:11px;color:#e74c3c">Server offline — run uvicorn backend.main:app --reload</div>';
  }
  btn.disabled=false;
}

renderGrid();
setActive(document.querySelector('.slot'));
getRecs();
</script>
</body>
</html>
